:root{--stage:#04050a;--ink:#fff;--muted:#8b8fa3;--line:rgba(255,255,255,.12);--green:#4FF0C2;--ui:Söhne,'Groww Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark}
html,body{height:100%}
body{margin:0;background:radial-gradient(55% 45% at 50% 46%,rgba(87,98,252,.16),transparent 72%),var(--stage);color:var(--ink);font-family:var(--ui);
  overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-inline:16px;box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
.row{display:flex;align-items:center;gap:22px}
.phone{--k:1;position:relative;width:calc(411px*var(--k));height:calc(823px*var(--k));border-radius:calc(38px*var(--k));overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 40px 90px -20px rgba(0,0,0,.8);touch-action:none;cursor:pointer;flex:none}
#stage{position:absolute;left:0;top:0;width:411px;height:823px;transform:scale(var(--k));transform-origin:0 0;background:#070810;overflow:hidden}
.hdr{position:absolute;left:0;top:0;z-index:5;pointer-events:none;transition:opacity .25s}
.phone.held .hdr{opacity:0}
.seg-fill{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
.card{display:none}.card.on{display:block}
svg .card.on{display:inline}
.nav{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.nav:hover{background:rgba(255,255,255,.1)}.nav:disabled{opacity:.3;cursor:default}
.meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--muted)}
.count{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.dot{width:3px;height:3px;border-radius:50%;background:var(--muted)}
#autoBtn{font:500 12px/1 var(--ui);color:#070810;background:var(--green);border:0;border-radius:999px;padding:7px 12px;cursor:pointer}
#autoBtn.off{background:rgba(255,255,255,.1);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.end{position:absolute;inset:0;z-index:9;display:grid;place-items:center;background:rgba(7,8,16,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s}
.end.show{opacity:1;pointer-events:auto}
.end button{font:500 15px/1 var(--ui);color:#070810;background:#fff;border:0;border-radius:999px;padding:14px 22px;cursor:pointer}
.toast{position:absolute;left:50%;bottom:9%;z-index:8;transform:translate(-50%,12px);opacity:0;pointer-events:none;font:500 13px/1.2 var(--ui);color:#fff;
  background:rgba(28,30,44,.92);border:1px solid var(--line);padding:10px 16px;border-radius:999px;white-space:nowrap;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){.nav{display:none}.hint-long{display:none}}@media (min-width:641px){.hint-short{display:none}}
text{font-variant-numeric:tabular-nums}

<script>/* Intro card: dial rotates to September, progress arc grows from the marker, bottom-up reveal */
(()=>{
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const tg=$('01 Ticks'),lg=$('01 Labels'),ag=$('01 Arc'),mr=$('c01revealRect');
if(!tg)return;
const CX=205.68,CY=555.47;               // dial centre (reference)
const AX=205.5,AY=552.5,AR=285.5;         // progress-arc centre / radius (reference)
const MON=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const OFF0=120;                           // dial starts 4 months back (MAY under the marker)
const ARC=50;                             // final arc sweep in degrees
const ROT_AT=150,ROT_DUR=2750,REV_DUR=2100;
const rad=Math.PI/180,clamp=v=>v<0?0:v>1?1:v;
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const X=t=>((ax*t+bx)*t+cx)*t,Y=t=>((ay*t+by)*t+cy)*t,D=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{let t=x;for(let i=0;i<8;i++){const e=X(t)-x,d=D(t);if(Math.abs(e)<1e-5||!d)break;t-=e/d}return Y(clamp(t))}}
const easeRot=bez(.5,.02,.12,1),easeRev=bez(.45,.05,.25,1);
const mix=(a,b,t)=>a+(b-a)*t;
const lerpTab=(tab,x)=>{if(x<=tab[0][0])return tab[0][1];for(let i=1;i<tab.length;i++)if(x<=tab[i][0]){const[a,b]=[tab[i-1],tab[i]];return mix(a[1],b[1],(x-a[0])/(b[0]-a[0]))}return tab[tab.length-1][1]};
const norm=d=>((d+540)%360)-180;

/* ticks: 60 × 6°, a major every month */
const ticks=[];for(let i=0;i<60;i++){const l=document.createElementNS(NS,'line');l.setAttribute('stroke-linecap','round');tg.appendChild(l);ticks.push({l,base:90+i*6,major:i%5===0})}
/* month labels */
const labs=MON.map((m,k)=>{const t=document.createElementNS(NS,'text');t.textContent=m;t.setAttribute('text-anchor','middle');t.setAttribute('dominant-baseline','central');lg.appendChild(t);return{t,base:90+(k-8)*30}});
/* progress arc: short solid-colour segments emulate the reference conic gradient */
const NSEG=40,segs=[];for(let i=0;i<NSEG;i++){const p=document.createElementNS(NS,'path');p.setAttribute('stroke-width','11');p.setAttribute('fill','none');ag.appendChild(p);segs.push(p)}
const GRAD=[[0,[92,242,200,1]],[.12,[91,219,207,1]],[.27,[88,176,218,1]],[.42,[86,127,231,1]],[.54,[84,92,239,1]],[.6,[84,92,239,.86]],[.72,[84,92,239,.55]],[.84,[84,92,239,.3]],[.9,[84,92,239,.15]],[1,[84,92,239,0]]];
const gcol=u=>{let i=1;while(i<GRAD.length-1&&GRAD[i][0]<u)i++;const[a,b]=[GRAD[i-1],GRAD[i]],f=clamp((u-a[0])/(b[0]-a[0]));
  const c=a[1].map((v,k)=>mix(v,b[1][k],f));return[`rgb(${c[0]|0},${c[1]|0},${c[2]|0})`,c[3]]};
const W=[255,255,255],G=[0x7C,0x82,0xAE],M=[0x5C,0xF2,0xC9];
const rgb=(a,b,t)=>`rgb(${mix(a[0],b[0],t)|0},${mix(a[1],b[1],t)|0},${mix(a[2],b[2],t)|0})`;
const LAB_R=[[0,1],[30,.68],[60,.38],[90,.13],[118,0]],LAB_L=[[0,1],[30,.37],[60,.21],[90,.07],[118,0]];
const pt=(r,a)=>[CX+r*Math.cos(a*rad),CY-r*Math.sin(a*rad)];
const f1=v=>v.toFixed(2);

window.HOOKS=window.HOOKS||{};
window.HOOKS[0]=t=>{
  const rp=easeRot(clamp((t-ROT_AT)/ROT_DUR)),off=OFF0*(1-rp);
  /* bottom-up reveal */
  mr.setAttribute('y',f1(mix(640,-170,easeRev(clamp(t/REV_DUR)))));
  /* ticks */
  for(const k of ticks){const a=k.base+off,d=norm(a-90),ad=Math.abs(d);
    let op,col,dash=false;
    if(ad<2.5||ad>100){k.l.setAttribute('stroke-opacity','0');continue}
    const wop=Math.max(0,.99-.0102*ad);
    const w=d>0?clamp((d-26)/8):0;                       // future zone (past OCT) turns grey
    const gop=Math.max(0,.3-(d-30)*.0045);
    op=mix(wop,gop,w);col=rgb(W,G,w);dash=k.major&&w>.5;
    const[r0,sw]=k.major?[225.6,1.974]:[245.4,1.41];const[x1,y1]=pt(r0,a),[x2,y2]=pt(265.1,a);
    const l=k.l;l.setAttribute('x1',f1(x1));l.setAttribute('y1',f1(y1));l.setAttribute('x2',f1(x2));l.setAttribute('y2',f1(y2));
    l.setAttribute('stroke',col);l.setAttribute('stroke-opacity',op.toFixed(3));l.setAttribute('stroke-width',sw);

/* ---------- animation helpers ---------- */

  if(el instanceof SVGElement)el.style.transformBox='fill-box';

}

    const two=L.st===2,idx=two?i2++:i1++;
